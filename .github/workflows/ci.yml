name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  back:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ATENÇÃO: a linguagem do back-end ainda NÃO foi decidida. A ata de
      # kick-off fechou React + TypeScript só para o front.
      # Até a escolha acontecer, este workflow detecta a stack pelo arquivo de
      # manifesto e passa sem fazer nada se não achar nenhum. Quando o projeto
      # nascer, o CI liga sozinho — mas vale simplificar este arquivo depois,
      # deixando só o caminho que o time realmente escolheu.
      - name: Qual stack está no repositório?
        id: stack
        run: |
          if   [ -f package.json ];      then echo "tipo=node"   >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo "tipo=python" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ];            then echo "tipo=go"     >> "$GITHUB_OUTPUT"
          else
            echo "tipo=nenhuma" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhum projeto detectado. O CI liga sozinho quando o back-end nascer."
          fi

      # ---------- Node ----------
      - uses: actions/setup-node@v4
        if: steps.stack.outputs.tipo == 'node'
        with:
          node-version: lts/*
          cache: npm
      - name: Node — dependências
        if: steps.stack.outputs.tipo == 'node'
        run: npm ci
      - name: Node — lint
        if: steps.stack.outputs.tipo == 'node'
        run: npm run lint --if-present
      - name: Node — testes
        if: steps.stack.outputs.tipo == 'node'
        run: npm run test --if-present

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        if: steps.stack.outputs.tipo == 'python'
        with:
          python-version: '3.x'
      - name: Python — dependências
        if: steps.stack.outputs.tipo == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff pytest
      - name: Python — lint
        if: steps.stack.outputs.tipo == 'python'
        run: ruff check .
      - name: Python — testes
        if: steps.stack.outputs.tipo == 'python'
        run: pytest -q

      # ---------- Go ----------
      - uses: actions/setup-go@v5
        if: steps.stack.outputs.tipo == 'go'
        with:
          go-version: stable
      - name: Go — vet
        if: steps.stack.outputs.tipo == 'go'
        run: go vet ./...
      - name: Go — testes
        if: steps.stack.outputs.tipo == 'go'
        run: go test ./...
